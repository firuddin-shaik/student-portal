<!DOCTYPE html>
<html>
<head>
  <title>ECE Student Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background: #0d1117; color: white; text-align: center; margin: 0; padding: 20px; }
   .login-box { margin-top: 80px; }
    input { padding: 12px; margin: 8px; width: 280px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: white; font-size: 16px; }
    button { padding: 12px 40px; background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:hover { background: #2ea043; }
   .dashboard { display: none; margin-top: 40px; }
   .profile-pic { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #238636; }
   .default-icon {
      width: 130px; height: 130px; border-radius: 50%; background: #21262d;
      color: #58a6ff; font-size: 70px; display: inline-flex;
      align-items: center; justify-content: center; border: 4px solid #238636;
    }
   .card { background: #161b22; padding: 20px; margin: 15px auto; width: 320px; border-radius: 12px; border: 1px solid #30363d; }
    h1 { color: #58a6ff; }
    h2 { margin: 20px 0; }
  </style>
</head>
<body>

  <!-- LOGIN PAGE -->
  <div class="login-box" id="loginPage">
    <h1>🎓 ECE Student Portal</h1>
    <p>Login to view your results</p>
    <input type="text" id="rollInput" placeholder="Roll Number"><br>
    <input type="password" id="passInput" placeholder="Common Password"><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color: #f85149; margin-top: 15px;"></p>
  </div>

  <!-- DASHBOARD PAGE -->
  <div class="dashboard" id="dashboardPage">
    <div id="profileArea"></div>
    <h2 id="studentName"></h2>
    <div class="card"> <b>📚 Sem 1 CGPA:</b> <span id="sem1"></span> </div>
    <div class="card"> <b>📚 Sem 2 CGPA:</b> <span id="sem2"></span> </div>
    <div class="card"> <b>📊 Attendance:</b> <span id="att"></span>% </div>
    <button onclick="logout()">Logout</button>
  </div>

<script>
// ====== CONFIG START ======
const COMMON_PASSWORD = "fairu23"; // Ikkada nee istam vachina password pettu

const studentsData = {
  "222G1A04A8": { name: "Firuddin", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A04A8.jpeg" },
  "222G1A0460": { name: "HEMANTH", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A0460.jpeg" },
  "222G1A0461": { name: "PRANITHA", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A0461.jpeg" },
  "222G1A0496": { name: "BHAVANA", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A0496.jpeg" },
  "222G1A0475": { name: "HARSHA", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A0475.jpeg" },
  "222G1A0498": { name: "USMAN", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A0498.jpeg" },
  "222G1A04B6": { name: "SHAKEER", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A04B6.jpeg" },
  "222G1A04B1": { name: "KULLAYAPPA", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A04B1.jpeg" },
  "222G1A04A2": { name: "MOSI", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A04A2.jpeg" },
  "222G1A0483": { name: "ANU", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A0483.jpeg" },

  "222G1A0491": { name: "SUMATHI", sem1: 8.5, sem2: 8.8, att: 92, photo: "images/222G1A0491.jpeg" },
};
// ====== CONFIG END ======

function login() {
  const roll = document.getElementById("rollInput").value.trim().toUpperCase();
  const pass = document.getElementById("passInput").value;
  const error = document.getElementById("error");

  if (pass!== COMMON_PASSWORD) {
    error.innerText = "Wrong Password!";
    return;
  }
  if (!studentsData[roll]) {
    error.innerText = "Roll Number not found!";
    return;
  }

  const student = studentsData[roll];
  error.innerText = "";
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("dashboardPage").style.display = "block";

  const profileHTML = student.photo
   ? `<img src="${student.photo}" class="profile-pic" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">
       <div class="default-icon" style="display:none;">👤</div>`
    : `<div class="default-icon">👤</div>`;

  document.getElementById("profileArea").innerHTML = profileHTML;
  document.getElementById("studentName").innerText = student.name;
  document.getElementById("sem1").innerText = student.sem1;
  document.getElementById("sem2").innerText = student.sem2;
  document.getElementById("att").innerText = student.att;
}

function logout() {
  document.getElementById("loginPage").style.display = "block";
  document.getElementById("dashboardPage").style.display = "none";
  document.getElementById("rollInput").value = "";
  document.getElementById("passInput").value = "";
}
</script>

</body>
</html>
