<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Firuddin Shaik</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
    }
    .card {
      background: white; padding: 40px; border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 90%; max-width: 450px;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 8px; }
    p { color: #666; margin-bottom: 24px; }
    input {
      width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #eee;
      border-radius: 8px; font-size: 16px;
    }
    input:focus { border-color: #667eea; outline: none; }
    button {
      width: 100%; padding: 12px; background: #667eea; color: white;
      border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 16px;
    }
    button:hover { background: #5a6fd8; }
    .dashboard { display: none; text-align: left; }
    .profile { text-align: center; margin-bottom: 24px; }
      .avatar {
     width: 80px; height: 80px; border-radius: 50%;
     margin: 0 auto 12px; object-fit: cover; border: 3px solid #667eea;
   }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #f8f9fa; }
    .logout { background: #dc3545; margin-top: 8px; }
    .logout:hover { background: #c82333; }
    .error { color: #dc3545; margin-top: 8px; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Login Form -->
    <div id="loginForm">
      <h1>Student Portal</h1>
      <p>Developed by Firuddin Shaik<br>ECE Student | Future Developer</p>
      <input type="text" id="username" placeholder="Username" value="firuddin">
      <input type="password" id="password" placeholder="Password" value="1234">
      <button onclick="login()">Login</button>
      <p class="error" id="errorMsg">Invalid username or password</p>
      <p style="font-size: 12px; margin-top: 16px; color: #999;">Demo: firuddin / 1234</p>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
      <div class="profile">
        
          <img src="profile.jpg" class="avatar" alt="Firuddin">
        <p>Roll No: 222G1A04A8 | ECE - final Year</p>
      </div>
      
      <h3>Semester Marks</h3>
      <table>
        <tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>
          <tr><td>VLSI Design</td><td>95</td><td>O</td></tr>
   <tr><td>Antennas</td><td>88</td><td>A+</td></tr>
   <tr><td>Digital Communication</td><td>91</td><td>A+</td></tr>
      </table>

        <h3>Attendance: 92%</h3>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <script>
    function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      if(user === 'firuddin' && pass === '1234') {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('errorMsg').style.display = 'none';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }
    
    function logout() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('username').value = 'firuddin';
      document.getElementById('password').value = '1234';
    }
  </script>
</body>
</html>
